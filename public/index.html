<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 ZL PvP | STATS EN VIVO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #FFD700;
            --dark-gold: #FFA500;
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --card-bg: rgba(26, 26, 26, 0.95);
            --glow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--gold);
            overflow-x: hidden;
            position: relative;
        }

        /* Partículas doradas */
        .gold-particle {
            position: fixed;
            background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, rgba(255,215,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Contenedor principal */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2.5rem;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.15), transparent);
            border-radius: 30px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(5px);
            box-shadow: var(--glow);
        }

        .title {
            background: linear-gradient(to right, #FFF, var(--gold), #FFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            color: rgba(255, 215, 0, 0.9);
            font-size: 1.3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .stat-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(255, 215, 0, 0.1),
                transparent 30%
            );
            animation: rotate 8s linear infinite;
            pointer-events: none;
        }

        .stat-value {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), #FFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0.3rem 0;
            text-shadow: var(--glow);
            position: relative;
            z-index: 2;
        }

        .stat-label {
            font-size: 0.9rem;
            color: rgba(255, 215, 0, 0.9);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-icon {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 0.3rem;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.5));
        }

        /* Charts Section - AHORA CON TAMAÑO FIJO MÁS COMPACTO */
        .charts-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .chart-container {
            background: var(--card-bg);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: var(--glow);
            height: 300px; /* ALTURA FIJA PARA HACERLAS MÁS COMPACTAS */
            display: flex;
            flex-direction: column;
        }

        .chart-title {
            font-size: 1.2rem;
            color: var(--gold);
            margin-bottom: 1rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chart-wrapper {
            flex: 1;
            position: relative;
            min-height: 0; /* IMPORTANTE PARA FLEXBOX */
        }

        canvas {
            max-height: 100%;
            width: 100% !important;
        }

        /* Script Section */
        .script-section {
            background: var(--card-bg);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: var(--glow);
        }

        .section-title {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .script-code {
            background: #1a1a1a;
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 1.5rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.9rem;
            color: #FFD700;
            line-height: 1.5;
            overflow-x: auto;
            white-space: pre-wrap;
            margin-bottom: 1.2rem;
            border-left: 4px solid var(--gold);
            max-height: 250px;
            overflow-y: auto;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--gold), var(--dark-gold));
            color: #000;
            border: 1px solid #FFF;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
        }

        .btn-secondary:hover {
            background: rgba(255, 215, 0, 0.15);
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 1.5rem;
            color: rgba(255, 215, 0, 0.7);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
        }

        /* Animations */
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .online-badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 10px #00ff00;
            animation: pulse 1.5s infinite;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .charts-section {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .title {
                font-size: 2.5rem;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .stat-value {
                font-size: 2.2rem;
            }
            
            .chart-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- Partículas doradas -->
    <div id="particles"></div>

    <!-- Contenido principal -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title"><i class="fas fa-crown"></i> ⚜️ ZL | STATS</h1>
            <p class="subtitle">⚡ Logística zL⚡</p>
        </header>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-bolt"></i></div>
                <div class="stat-value" id="total">0</div>
                <div class="stat-label">TOTAL</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-calendar-day"></i></div>
                <div class="stat-value" id="today">0</div>
                <div class="stat-label">HOY</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-value" id="online">0</div>
                <div class="stat-label">ONLINE</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
                <div class="stat-value" id="peakOnline">0</div>
                <div class="stat-label">RÉCORD</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-trophy"></i></div>
                <div class="stat-value" id="peakToday">0</div>
                <div class="stat-label">PICO HOY</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-value" id="hourly">0</div>
                <div class="stat-label">MAX/HORA</div>
            </div>
        </div>

        <!-- Charts Section - AHORA 3 GRÁFICAS EN LÍNEA -->
        <div class="charts-section">
            <!-- Gráfica 1: Online por Hora (últimas 12h) -->
            <div class="chart-container">
                <h3 class="chart-title"><i class="fas fa-chart-bar"></i> ONLINE POR HORA</h3>
                <div class="chart-wrapper">
                    <canvas id="hourlyChart"></canvas>
                </div>
            </div>
            
            <!-- Gráfica 2: Ejecuciones por Día (últimos 7 días) -->
            <div class="chart-container">
                <h3 class="chart-title"><i class="fas fa-chart-line"></i> EJECUCIONES/DÍA</h3>
                <div class="chart-wrapper">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <!-- Gráfica 3: Online en Tiempo Real (últimos 20 puntos) -->
            <div class="chart-container">
                <h3 class="chart-title"><i class="fas fa-chart-line"></i> TIEMPO REAL</h3>
                <div class="chart-wrapper">
                    <canvas id="realtimeChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Script Section -->
        <div class="script-section">
            <h2 class="section-title"><i class="fas fa-code"></i> 📜 CÓDIGO PARA ROBLOX</h2>
            
            <div class="script-code" id="scriptCode">
-- 🏆 loadstrintg 
            </div>
            
            <div class="buttons">
                <button class="btn btn-primary" onclick="copyScript()">
                    <i class="fas fa-copy"></i> Copiar Script
                </button>
                <button class="btn btn-secondary" onclick="updateStats()">
                    <i class="fas fa-sync-alt"></i> Actualizar
                </button>
                <button class="btn btn-secondary" onclick="window.open('/api/online-history.js', '_blank')">
                    <i class="fas fa-history"></i> API
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p><i class="fas fa-heart" style="color: #ff4444;"></i> ZL Contador v3.0</p>
            <p>
                <span class="online-badge"></span>
                <span id="status">CONECTADO</span> | 
                <span id="lastUpdate">--:--:--</span>
            </p>
        </footer>
    </div>

    <script>
        // Variables globales
        let hourlyChart, dailyChart, realtimeChart;
        let currentUrl = window.location.origin;
        let statsHistory = [];

        // Crear partículas
        function createParticles() {
            const particles = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'gold-particle';
                const size = Math.random() * 80 + 20;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animation = `float ${Math.random() * 15 + 8}s infinite alternate`;
                particles.appendChild(particle);
            }
        }

        // Formatear números
        function formatNumber(num) {
            if (num === undefined || num === null) return '0';
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // Actualizar stats
        async function updateStats() {
            try {
                const response = await fetch('/api/counter.js');
                const data = await response.json();
                
                document.getElementById('total').textContent = formatNumber(data.total);
                document.getElementById('today').textContent = formatNumber(data.today);
                document.getElementById('online').textContent = formatNumber(data.online);
                document.getElementById('peakOnline').textContent = formatNumber(data.peakOnline || 0);
                document.getElementById('peakToday').textContent = formatNumber(data.peakToday || 0);
                
                // Guardar histórico para gráfico en tiempo real
                statsHistory.push({
                    time: new Date().toLocaleTimeString().slice(0, 5),
                    online: data.online || 0
                });
                if (statsHistory.length > 15) statsHistory.shift();
                
                updateRealtimeChart();
                
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                document.getElementById('status').innerHTML = '🟢 CONECTADO';
                
                return data;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').innerHTML = '🔴 DESCONECTADO';
            }
        }

        // Obtener stats detalladas
        async function getDetailedStats() {
            try {
                const response = await fetch('/api/stats.js');
                const data = await response.json();
                
                // Actualizar máximo por hora
                if (data.hourly && data.hourly.length > 0) {
                    const lastHour = data.hourly[data.hourly.length - 1];
                    document.getElementById('hourly').textContent = formatNumber(lastHour?.maxOnline || 0);
                }
                
                // ACTUALIZAR GRÁFICA POR HORA (últimas 12 horas, mostrando cada 2 para compactar)
                if (data.hourly && hourlyChart) {
                    // Tomar últimas 12 horas pero mostrar cada 2 para que sea más compacto
                    const last12 = data.hourly.slice(-12);
                    const filteredHours = [];
                    const filteredValues = [];
                    
                    for (let i = 0; i < last12.length; i += 2) {
                        filteredHours.push(last12[i].hour);
                        filteredValues.push(last12[i].maxOnline || 0);
                    }
                    
                    hourlyChart.data.labels = filteredHours;
                    hourlyChart.data.datasets[0].data = filteredValues;
                    hourlyChart.update();
                }
                
                // ACTUALIZAR GRÁFICA DIARIA (ejecuciones por día)
                if (data.daily && dailyChart) {
                    // Limitar a últimos 7 días
                    const last7 = data.daily.slice(-7);
                    dailyChart.data.labels = last7.map(d => d.date || '');
                    dailyChart.data.datasets[0].data = last7.map(d => d.count || 0);
                    dailyChart.update();
                }
                
                return data;
            } catch (error) {
                console.error('Error stats:', error);
            }
        }

        // Inicializar gráficas
        function initCharts() {
            // Gráfica 1: Online por hora (más compacta)
            const hourlyCtx = document.getElementById('hourlyChart').getContext('2d');
            hourlyChart = new Chart(hourlyCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Max Online',
                        data: [],
                        backgroundColor: 'rgba(255, 215, 0, 0.7)',
                        borderColor: '#FFD700',
                        borderWidth: 1,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 215, 0, 0.1)' },
                            ticks: { color: '#FFD700', stepSize: 1, font: { size: 10 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#FFD700', font: { size: 9 }, maxRotation: 30 }
                        }
                    }
                }
            });

            // Gráfica 2: Ejecuciones por día
            const dailyCtx = document.getElementById('dailyChart').getContext('2d');
            dailyChart = new Chart(dailyCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Ejecuciones',
                        data: [],
                        borderColor: '#FFA500',
                        backgroundColor: 'rgba(255, 165, 0, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#FFD700'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 165, 0, 0.1)' },
                            ticks: { color: '#FFD700', font: { size: 10 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#FFD700', font: { size: 9 } }
                        }
                    }
                }
            });

            // Gráfica 3: Tiempo real
            const realtimeCtx = document.getElementById('realtimeChart').getContext('2d');
            realtimeChart = new Chart(realtimeCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Online',
                        data: [],
                        borderColor: '#00ff00',
                        backgroundColor: 'rgba(0, 255, 0, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(0, 255, 0, 0.1)' },
                            ticks: { color: '#00ff00', stepSize: 1, font: { size: 10 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#00ff00', font: { size: 8 }, maxRotation: 30 }
                        }
                    }
                }
            });
        }

        // Actualizar gráfico en tiempo real
        function updateRealtimeChart() {
            if (!realtimeChart) return;
            
            realtimeChart.data.labels = statsHistory.map(s => s.time);
            realtimeChart.data.datasets[0].data = statsHistory.map(s => s.online);
            realtimeChart.update();
        }

        // Copiar script
        async function copyScript() {
            const scriptText = document.getElementById('scriptCode').textContent;
            await navigator.clipboard.writeText(scriptText);
            
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> COPIADO!';
            btn.style.background = 'linear-gradient(45deg, #00FF00, #00CC00)';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = 'linear-gradient(45deg, #FFD700, #FFA500)';
            }, 1500);
        }

        // Sistema de actualización automática
        function startAutoUpdate() {
            updateStats();
            getDetailedStats();
            
            setInterval(updateStats, 3000);
            setInterval(getDetailedStats, 30000);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            initCharts();
            startAutoUpdate();
            
            // Efecto fade in
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.8s';
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
